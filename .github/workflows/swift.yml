# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests with coverage
      run: bash scripts/test-coverage.sh
    - name: Verify optional dependency plugin in a downstream package
      run: python3 scripts/test-dependency-plugin.py --build-system native
    - name: Build iOS Simulator
      run: >-
        xcodebuild -scheme AppleViewModel
        -destination 'generic/platform=iOS Simulator'
        -derivedDataPath "$RUNNER_TEMP/apple-view-model-ios"
        CODE_SIGNING_ALLOWED=NO build
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        use_oidc: true
        files: .build/coverage.lcov
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
